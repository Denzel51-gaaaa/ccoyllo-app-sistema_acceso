<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscar Producto</title>
</head>
<body>
    <h2>Buscador de Productos</h2>
    <input type="text" id="codigoProducto" placeholder="Ingrese código (Ej: P001)">
    <button id="btnBuscar">Buscar</button>
    
    <div id="resultado" style="margin-top: 20px;"></div>
    
    <hr>
    <button onclick="window.location.href='dashboard.html'">Regresar</button>

    <script>
        if (localStorage.getItem('autenticado') !== 'true') {
            window.location.href = 'index.html';
        }

        const BACKEND_URL = "https://ccoyllo-app-sistema-acceso.onrender.com"; // Se cambiará en el despliegue

        document.getElementById('btnBuscar').addEventListener('click', async () => {
            const codigo = document.getElementById('codigoProducto').value;
            const resultadoDiv = document.getElementById('resultado');
            
            if(!codigo) return;

            try {
                const response = await fetch(`${BACKEND_URL}/producto/${codigo}`);
                const data = await response.json();

                if (data.success) {
                    resultadoDiv.innerHTML = `
                        <h3>Producto Encontrado:</h3>
                        <p><strong>Nombre:</strong> ${data.producto.nombre}</p>
                        <p><strong>Precio:</strong> S/. ${data.producto.precio}</p>
                        <p><strong>Stock:</strong> ${data.producto.stock} unidades</p>
                    `;
                } else {
                    resultadoDiv.innerHTML = `<p style="color: red;">${data.message}</p>`;
                }
            } catch (error) {
                resultadoDiv.innerHTML = `<p style="color: red;">Error al conectar con el servidor.</p>`;
            }
        });
    </script>
</body>
</html>
