<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Sistema de Acceso</title>
</head>
<body>
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Usuario" required><br><br>
        <input type="password" id="password" placeholder="Contraseña" required><br><br>
        <button type="submit">Ingresar</button>
    </form>
    <p id="mensaje" style="color: red;"></p>

    <script>
        const BACKEND_URL = "https://ccoyllo-app-sistema-acceso.onrender.com"; // Se cambiará en el despliegue

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${BACKEND_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                if (data.success) {
                    localStorage.setItem('autenticado', 'true'); 
                    window.location.href = 'dashboard.html';
                } else {
                    document.getElementById('mensaje').innerText = data.message;
                }
            } catch (error) {
                document.getElementById('mensaje').innerText = "Error al conectar con el servidor backend.";
            }
        });
    </script>
</body>
</html>
