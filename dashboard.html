<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Principal</title>
</head>
<body>
    <h1>Bienvenido al Sistema Principal</h1>
    <hr>
    <button onclick="window.location.href='buscar.html'">Ir al Buscador de Productos</button>
    <br><br>
    <button id="btnSalir" style="background-color: #ff4d4d; color: white;">Salir del Sistema</button>

    <script>
        
        if (localStorage.getItem('autenticado') !== 'true') {
            window.location.href = 'index.html';
        }

        document.getElementById('btnSalir').addEventListener('click', () => {
            localStorage.removeItem('autenticado');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
